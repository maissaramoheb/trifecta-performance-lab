name: CI & Quality Assurance

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Linter
        run: npm run lint

      - name: Run TypeScript Validation
        run: npx tsc --noEmit

      - name: Run OpenAI Sites Build (vinext)
        run: npm run build

      - name: Run Vercel Build (Next.js App Router)
        run: npm run build:vercel

      - name: Run Test Suite
        run: npm test
